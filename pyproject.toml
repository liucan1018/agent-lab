[project]
name = "agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "liucan", email = "3509305473@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<4",
    "pydantic>=2,<3",
    "typing-extensions>=4.16.0",
]

[project.scripts]
agent-lab = "agent_lab:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agent_lab", "llm"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
